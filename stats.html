<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>QR štatistiky</title>
<style>
  :root { --bg:#f3efe6; --ink:#181614; --muted:#6b645c; --acc:#b3121c; --line:#e2dbcf; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 60px; }
  h1 { font-size: 26px; margin: 0 0 4px; } .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .code { font-weight: 700; } .to { color: var(--muted); font-size: 13px; word-break: break-all; }
  .tot { font-size: 30px; font-weight: 800; color: var(--acc); white-space: nowrap; } .tot small { font-size: 12px; color: var(--muted); font-weight: 400; }
  .bars { display: grid; grid-template-columns: repeat(30, 1fr); gap: 3px; align-items: end; height: 70px; margin-top: 12px; }
  .bars i { display: block; background: var(--acc); border-radius: 2px 2px 0 0; min-height: 2px; opacity: .85; }
  .bars i.z { background: var(--line); }
  .ax { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .row { display: flex; gap: 18px; font-size: 13px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; } .row b { color: var(--ink); }
  a { color: var(--acc); }
</style>
</head>
<body>
<main>
  <h1>QR štatistiky</h1>
  <p class="sub">Počet naskenovaní každého QR kódu, celkovo a za posledných 30 dní.</p>
  <div id="list">Načítavam…</div>
</main>
<script>
/* Počítadlo má limit dotazov, preto ide všetko postupne (s čakaním pri limite) a uzavreté dni sa pamätajú v prehliadači. */
const API = 'https://abacus.jasoncameron.dev/get/leumasdam-q/', N = 14;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const cache = (() => { try { return JSON.parse(localStorage.getItem('qstats') || '{}'); } catch (e) { return {}; } })();
const save = () => { try { localStorage.setItem('qstats', JSON.stringify(cache)); } catch (e) {} };
const today = new Date().toISOString().slice(0, 10);
async function get(k, final) {
  if (final && k in cache) return cache[k];
  for (let tries = 0; tries < 6; tries++) {
    const r = await fetch(API + encodeURIComponent(k)).catch(() => null);
    if (r && r.status === 429) { const t = await r.json().catch(() => ({})); const s = parseFloat((t.error || '').match(/([\d.]+)s/)?.[1] || '3'); await sleep(s * 1000 + 300); continue; }
    const v = r && r.ok ? ((await r.json()).value || 0) : 0;
    if (final) { cache[k] = v; save(); }
    await sleep(160);
    return v;
  }
  return 0;
}
const days = [...Array(N)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - (N - 1) + i); return d.toISOString().slice(0, 10); });
document.querySelector('.sub').textContent = `Počet naskenovaní každého QR kódu, celkovo a za posledných ${N} dní.`;
fetch('links.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(async map => {
  const list = document.getElementById('list'); list.innerHTML = '';
  const cards = Object.entries(map).map(([code, to]) => {
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = `<div class="top"><div><div class="code">${code}</div><div class="to">→ ${to}</div></div><div class="tot">…</div></div>`;
    list.appendChild(card); return [code, card];
  });
  for (const [code, card] of cards) {
    const total = await get(code, false);
    card.querySelector('.tot').innerHTML = `${total} <small>naskenovaní</small>`;
    const per = [];
    for (const d of days) per.push(await get(code + '.' + d, d < today));
    const max = Math.max(1, ...per), sum = a => a.reduce((x, y) => x + y, 0);
    card.insertAdjacentHTML('beforeend', `<div class="bars" style="grid-template-columns:repeat(${N},1fr)">${per.map((v, i) => `<i class="${v ? '' : 'z'}" style="height:${Math.max(3, v / max * 100)}%" title="${days[i]}: ${v}"></i>`).join('')}</div>
      <div class="ax"><span>${days[0].slice(5).split('-').reverse().join('.')}.</span><span>dnes</span></div>
      <div class="row"><span>Dnes: <b>${per[N - 1]}</b></span><span>Posledných 7 dní: <b>${sum(per.slice(-7))}</b></span><span>Posledných ${N} dní: <b>${sum(per)}</b></span><span><a href="qr/${code}.png" download>Stiahnuť QR</a></span></div>`);
  }
});
</script>
</body>
</html>
